name: Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 18.x

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build

    - name: Azure Login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Infra
      id: deploy
      uses: azure/bicep-deploy@v2
      with:
        type: deploymentStack
        operation: create
        name: recipes
        scope: resourceGroup
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resource-group-name: recipes
        parameters-file: deploy/main.bicepparam
        action-on-unmanage-resources: delete
        deny-settings-mode: denyDelete
    
    - name: Get Static Web App deployment token
      uses: azure/CLI@v3
      with:
        azcliversion: latest
        inlineScript: |
          token=$(az staticwebapp secrets list \
            --name "${{ steps.deploy.outputs.staticWebAppName }}" \
            --query properties.apiKey \
            --output tsv)
          if [ -z "$token" ]; then
            echo "::error::Static Web App deployment token was empty"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

    - name: Upload Site
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
        action: upload
        app_location: public
        skip_app_build: true
